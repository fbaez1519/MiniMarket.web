<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniMarket - Login</title>

    <!-- ===== CDN ===== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        /* ============================================================ */
        /* ROOT VARIABLES                                              */
        /* ============================================================ */
        :root {
            --color-primary: #1a2a4a;
            --color-primary-light: #2c4a7a;
            --color-primary-dark: #0f1a2e;
            --color-secondary: #2ecc71;
            --color-secondary-dark: #27ae60;
            --color-danger: #e74c3c;
            --color-text-light: #7f8c8d;
            --color-card: #ffffff;
            --shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
            --radius: 16px;
            --transition: 0.3s ease;
        }

        /* ============================================================ */
        /* RESET                                                       */
        /* ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, var(--color-primary-dark), var(--color-primary), var(--color-primary-light));
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        /* ============================================================ */
        /* CARD                                                        */
        /* ============================================================ */
        .card-auth {
            background: var(--color-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 440px;
            padding: 2.2rem 2rem;
        }

        /* ============================================================ */
        /* LOGO                                                        */
        /* ============================================================ */
        .logo {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            background: linear-gradient(145deg, var(--color-secondary), var(--color-secondary-dark));
            border-radius: 50%;
            color: #fff;
            font-size: 2.2rem;
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.3);
        }

        .logo-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--color-primary);
            margin: 0.4rem 0 0.1rem;
        }

        .logo-subtitle {
            font-size: 0.8rem;
            color: var(--color-text-light);
        }

        /* ============================================================ */
        /* FORM                                                        */
        /* ============================================================ */
        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 0.25rem;
        }

        .input-group-text {
            background: #f8fafc;
            border: 2px solid #e8edf3;
            border-right: none;
            border-radius: 10px 0 0 10px;
            color: var(--color-text-light);
            padding: 0.5rem 0.8rem;
        }

        .form-control {
            border: 2px solid #e8edf3;
            border-radius: 10px;
            padding: 0.55rem 0.9rem;
            background: #f8fafc;
            transition: all var(--transition);
        }

        .input-group .form-control {
            border-radius: 0 10px 10px 0;
            border-left: none;
        }

        .form-control:focus {
            border-color: var(--color-primary-light);
            box-shadow: 0 0 0 4px rgba(44, 74, 122, 0.08);
            background: #fff;
        }

        /* ============================================================ */
        /* BUTTONS                                                     */
        /* ============================================================ */
        .btn-primary-custom {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 0.7rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
            background: linear-gradient(145deg, var(--color-secondary), var(--color-secondary-dark));
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(46, 204, 113, 0.3);
            transition: all var(--transition);
            cursor: pointer;
        }

        .btn-primary-custom:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(46, 204, 113, 0.4);
        }

        .btn-primary-custom:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* ============================================================ */
        /* TOGGLE PASSWORD                                             */
        /* ============================================================ */
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--color-text-light);
            cursor: pointer;
            padding: 4px;
            z-index: 5;
        }

        .toggle-password:hover {
            color: var(--color-primary);
        }

        .password-field {
            padding-right: 40px;
        }

        /* ============================================================ */
        /* MESSAGES                                                    */
        /* ============================================================ */
        .msg {
            padding: 0.6rem 0.8rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-top: 0.8rem;
            display: none;
        }

        .msg-info {
            display: block;
            background: #e8f4fd;
            color: #1a5276;
            border: 1px solid #aed6f1;
        }

        .msg-success {
            display: block;
            background: #eafaf1;
            color: #1a7a4a;
            border: 1px solid #82e0aa;
        }

        .msg-error {
            display: block;
            background: #fdedec;
            color: #922b21;
            border: 1px solid #f5b7b1;
        }

        /* ============================================================ */
        /* ACTION LINK                                                 */
        /* ============================================================ */
        .action-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0.6rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all var(--transition);
            color: var(--color-primary);
            background: #f0f4f8;
            border: 2px solid #e8edf3;
            margin-top: 1rem;
        }

        .action-link:hover {
            background: #e8f0fe;
            border-color: var(--color-primary-light);
            transform: translateY(-2px);
        }

        /* ============================================================ */
        /* DIVIDER                                                     */
        /* ============================================================ */
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.2rem 0;
            color: var(--color-text-light);
            font-size: 0.75rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e8edf3;
        }

        /* ============================================================ */
        /* RESPONSIVE                                                   */
        /* ============================================================ */
        @media (max-width: 480px) {
            .card-auth {
                padding: 1.5rem 1.2rem;
            }

            .logo-icon {
                width: 60px;
                height: 60px;
                font-size: 1.8rem;
            }

            .logo-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!-- CARD                                                        -->
    <!-- ============================================================ -->
    <div class="card-auth">

        <!-- ============================================================ -->
        <!-- LOGO                                                        -->
        <!-- ============================================================ -->
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-store"></i></div>
            <div class="logo-title">MiniMarket</div>
            <div class="logo-subtitle">Iniciar Sesión</div>
        </div>

        <!-- ============================================================ -->
        <!-- LOGIN FORM                                                  -->
        <!-- ============================================================ -->
        <form id="loginForm">
            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-envelope" style="color: var(--color-primary-light);"></i>
                    Correo Electrónico
                </label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="email" class="form-control" id="loginEmail"
                           placeholder="admin@minimarket.com" value="admin@minimarket.com" required>
                </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-key" style="color: var(--color-primary-light);"></i>
                    Contraseña
                </label>
                <div class="input-group" style="position: relative;">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control password-field" id="loginPassword"
                           placeholder="admin123" value="admin123" required>
                    <button type="button" class="toggle-password" onclick="togglePass('loginPassword')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-primary-custom" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Ingresar
            </button>

            <!-- Message -->
            <div id="loginMsg" class="msg"></div>
        </form>

        <!-- ============================================================ -->
        <!-- DIVIDER                                                     -->
        <!-- ============================================================ -->
        <div class="divider">
            <i class="fas fa-shield-alt" style="color: var(--color-secondary);"></i>
            Sistema Seguro
        </div>

        <!-- ============================================================ -->
        <!-- ACTION LINK                                                 -->
        <!-- ============================================================ -->
        <a href="register.html" class="action-link">
            <i class="fas fa-user-plus"></i> ¿No tienes cuenta? Regístrate aquí
        </a>

    </div>

    <!-- ============================================================ -->
    <!-- SCRIPTS                                                      -->
    <!-- ============================================================ -->
    <script>
        // =============================================================
        // UTILITIES
        // =============================================================

        /**
         * Muestra/oculta la contraseña en el campo de entrada
         * @param {string} id - ID del input de contraseña
         */
        function togglePass(id) {
            const input = document.getElementById(id);
            const icon = input.parentElement.querySelector('.toggle-password i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        /**
         * Muestra un mensaje en el elemento indicado
         * @param {HTMLElement} el - Elemento donde mostrar el mensaje
         * @param {string} msg - Texto del mensaje
         * @param {string} type - Tipo de mensaje: 'info', 'success', 'error'
         */
        function showMsg(el, msg, type) {
            el.textContent = msg;
            el.className = 'msg msg-' + type;
        }

        /**
         * Activa/desactiva el estado de carga de un botón
         * @param {HTMLElement} btn - Botón a modificar
         * @param {boolean} loading - true para cargando, false para normal
         */
        function setLoading(btn, loading) {
            btn.disabled = loading;
            btn.innerHTML = loading
                ? '<span class="spinner-border spinner-border-sm" role="status"></span> Procesando...'
                : btn.dataset.original;
        }

        // Guardar texto original del botón
        document.getElementById('loginBtn').dataset.original = document.getElementById('loginBtn').innerHTML;

        // Regex para validar email
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        // =============================================================
        // LOGIN
        // =============================================================
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // Obtener valores
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const msg = document.getElementById('loginMsg');
            const btn = document.getElementById('loginBtn');

            // Validar campos
            if (!email || !password) {
                showMsg(msg, '❌ Completa todos los campos.', 'error');
                return;
            }

            // Validar email
            if (!emailRegex.test(email)) {
                showMsg(msg, '❌ Formato de email inválido.', 'error');
                return;
            }

            // Activar estado de carga
            setLoading(btn, true);
            showMsg(msg, '⏳ Verificando credenciales...', 'info');

            try {
                // Petición al servidor
                const res = await fetch('http://localhost:5285/api/Auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                // Manejar errores
                if (!res.ok) {
                    if (res.status === 401 || res.status === 403) {
                        showMsg(msg, '❌ Credenciales incorrectas.', 'error');
                    } else {
                        showMsg(msg, '❌ ' + (data.message || data.title || 'Error en el servidor'), 'error');
                    }
                    setLoading(btn, false);
                    return;
                }

                // Guardar credenciales en localStorage
                localStorage.setItem('token', data.token);
                localStorage.setItem('usuario', data.usuario);
                localStorage.setItem('rol', data.rol || 'Usuario');

                // Mostrar éxito y redirigir
                showMsg(msg, '✅ Login exitoso. Redirigiendo...', 'success');

                //  Redirige a dashboard.html
                setTimeout(() => window.location.href = 'dashboard.html', 1500);

            } catch (error) {
                console.error('Error:', error);
                showMsg(msg, '❌ Error de conexión. Verifica el servidor en http://localhost:5285', 'error');
                setLoading(btn, false);
            }
        });

        // =============================================================
        // LIMPIAR MENSAJES AL ESCRIBIR
        // =============================================================
        document.querySelectorAll('#loginEmail, #loginPassword').forEach(el => {
            el.addEventListener('input', () => {
                const msg = document.getElementById('loginMsg');
                msg.className = 'msg';
                msg.textContent = '';
            });
        });

        // =============================================================
        // CONSOLA
        // =============================================================
        console.log('%c🛒 MiniMarket - Login', 'font-size:18px; font-weight:bold; color:#2ecc71;');
        console.log('%c📌 Credenciales de prueba:', 'font-weight:bold;');
        console.log('   📧 admin@minimarket.com');
        console.log('   🔑 admin123');
        console.log('%c🔗 API: http://localhost:5285', 'color:#7f8c8d;');
    </script>

</body>
</html>
